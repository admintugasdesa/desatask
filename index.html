  function loadTasksFromLocal() {
    try {
      const saved = localStorage.getItem(LS_TASKS_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
      }
    } catch (e) {
      console.error("Gagal membaca localStorage:", e);
    }
    return JSON.parse(JSON.stringify(DEFAULT_TASKS));
  }

  function saveTasksToLocal() {
    try {

      console.warn("Kapasitas localStorage penuh:", e);
    }

  // Mengirim perubahan satu tugas (atau foto bukti) ke Google Drive
  async function syncSingleTaskToCloud(task) {
    saveTasksToLocal();
    if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.startsWith("TEMPEL_")) return;

    try {
      const response = await fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'upsert', task: task })
      });
      const result = await response.json();
      if (result.status === 'ok' && Array.isArray(result.tasks)) {
        TASKS = result.tasks;
        saveTasksToLocal();
        renderAlurView(activeTaskId);
        renderMonitoringView();
      }
    } catch (err) {
      console.warn("Offline / gagal kirim ke Google Drive:", err);
      showToast("Tersimpan di HP (akan disinkronkan saat sinyal stabil).");
    }
  }

      try {
        const res = await fetch(GAS_WEB_APP_URL);
        const cloudTasks = await res.json();

        // Jika file desatask_db.json di Google Drive masih kosong, isi data bawaan
        if (Array.isArray(cloudTasks) && cloudTasks.length === 0) {

            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'seed', tasks: TASKS })
          });
          return;

          renderAlurView(activeTaskId);
          renderMonitoringView();

        console.warn("Sinkronisasi Google Drive tertunda:", err);
      }
    };

    await fetchFromDrive();

  // ==============================================================
  // ENGINE PENYIMPANAN HYBRID (LOCALSTORAGE + FIREBASE FIRESTORE)
  // ==============================================================
  function loadTasksFromLocal() {
    try {
      const saved = localStorage.getItem(LS_TASKS_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
      }
    } catch (e) {
      console.error("Gagal membaca localStorage:", e);
    }
    return JSON.parse(JSON.stringify(DEFAULT_TASKS));
  }

  function saveTasksToLocal() {
    try {
      localStorage.setItem(LS_TASKS_KEY, JSON.stringify(TASKS));
    } catch (e) {
      console.warn("Kapasitas localStorage penuh:", e);
    }
  }

  async function syncSingleTaskToCloud(task) {
    saveTasksToLocal();
    if (!db) return;
    try {
      await db.collection('desatask_tasks').doc(String(task.id)).set(task);
    } catch (err) {
      console.error("Gagal kirim ke Firestore (tersimpan di lokal):", err);
      showToast("Tersimpan di HP (akan disinkronkan saat sinyal stabil).");
    }
  }

  async function deleteSingleTaskFromCloud(taskId) {
    saveTasksToLocal();
    if (!db) return;
    try {
      await db.collection('desatask_tasks').doc(String(taskId)).delete();
    } catch (err) {
      console.error("Gagal hapus di Firestore:", err);
    }
  }

  function initDriveSync() {
    if (!db) return;
    db.collection('desatask_tasks').onSnapshot(async (snapshot) => {
      // Jika database Firestore masih kosong saat pertama kali dipakai, unggah data bawaan
      if (snapshot.empty) {
        const batch = db.batch();
        TASKS.forEach(t => {
          const ref = db.collection('desatask_tasks').doc(String(t.id));
          batch.set(ref, t);
        });
        await batch.commit();
        return;
      }

      const cloudTasks = [];
      snapshot.forEach((doc) => {
        cloudTasks.push(doc.data());
      });

      // Urutkan tugas terbaru di atas berdasarkan ID
      cloudTasks.sort((a, b) => b.id - a.id);
      TASKS = cloudTasks;
      saveTasksToLocal();

      // Segarkan tampilan secara realtime
      renderUserTaskList();
      renderAlurView(activeTaskId);
      renderMonitoringView();
      if (inspectedTaskId && !document.getElementById('modal-unit-detail').classList.contains('hidden')) {
        bukaUnitDetailModal(inspectedTaskId);
      }
    }, (error) => {
      console.warn("Listener Firestore terputus sementara:", error);
    });
  }

  // Muat State Pengguna & Tugas dari LocalStorage
  let TASKS = loadTasksFromLocal();
  const savedUserId = parseInt(localStorage.getItem(LS_USER_KEY), 10);
  let currentUser = APARATUR.find(a => a.id === savedUserId) || APARATUR[2];
  let activeTaskId = null;
  let monFilterAparatur = "semua";
  let monFilterStage = "semua";
  let monFilterCat = "semua";

  // Switch Tab
  function switchTab(tabName) {
    ['tugas', 'alur', 'capaian', 'monitoring'].forEach(t => {
      const v = document.getElementById('view-' + t);
      const b = document.getElementById('nav-' + t);
      if (v) v.classList.toggle('hidden', t !== tabName);
      if (b) {
        b.className = t === tabName 
          ? "flex-1 flex flex-col items-center text-gov-700 font-bold transition py-1"
          : "flex-1 flex flex-col items-center text-slate-400 font-medium hover:text-gov-700 transition py-1";
      }
    });

    if (tabName === 'alur') renderAlurView(activeTaskId);
    else if (tabName === 'tugas') renderUserTaskList();
    else if (tabName === 'monitoring') renderMonitoringView();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

      t.progress = (t.stage * 20) + '%';

      const note = (noteVal && noteVal.trim()) ? noteVal.trim() : `Progres ditingkatkan ke Tahap ${t.stage}: ${SOP_STEPS[t.stage - 1].title}`;
      t.proofNote = note;

      t.history.push({
        time: "Hari ini, " + new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + " WIB",
        actor: currentUser.nama + ` (${currentUser.jabatan})`,

  // Kompresi otomatis gambar dari HP agar aman disimpan di Firestore (< 150 KB)
  function compressImageToDataURL(file, maxWidth = 800, quality = 0.65) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function handleFotoUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    const t = TASKS.find(x => x.id === activeTaskId);
    if (!t) return;

    showToast("Mengompresi & menyimpan foto bukti...");
    try {
      const compressedDataUrl = await compressImageToDataURL(file);
      t.proofImg = compressedDataUrl;
      t.hasProof = true;
      t.lastUpdated = "Baru saja";
      if (!t.proofNote) t.proofNote = `Lampiran foto (${file.name}) oleh ${currentUser.nama}`;
      if (!t.history) t.history = [];
      t.history.push({
        time: "Hari ini, " + new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + " WIB",
        actor: currentUser.nama,
        note: `Mengunggah foto bukti lapangan: ${file.name}`,
        stage: t.stage
      });
      await syncSingleTaskToCloud(t);
      renderAlurView(t.id);
      renderMonitoringView();
      showToast(`Foto "${file.name}" tersimpan permanen!`);
    } catch (err) {
      showToast("Gagal memproses gambar. Coba file lain.");
    }
  }

  function renderMonitoringView() {
    const container = document.getElementById('mon-task-list');
    if (!container) return;

    let total = TASKS.length;
    let jalan = 0, bukti = 0, sah = 0;
    TASKS.forEach(t => {
      if (t.stage <= 2) jalan++;
      else if (t.stage <= 4) bukti++;
      else sah++;
    });

    document.getElementById('mon-stat-total').innerText = total;
    document.getElementById('mon-stat-jalan').innerText = jalan;
    document.getElementById('mon-stat-bukti').innerText = bukti;
    document.getElementById('mon-stat-sah').innerText = sah;

    let filtered = [...TASKS];
    if (monFilterAparatur !== 'semua') {
      filtered = filtered.filter(t => t.assignee.toLowerCase().includes(monFilterAparatur.toLowerCase()));
    }
    if (monFilterStage === '20-40') {
      filtered = filtered.filter(t => t.stage === 1 || t.stage === 2);
    } else if (monFilterStage === '60-80') {
      filtered = filtered.filter(t => t.stage === 3 || t.stage === 4);
    } else if (monFilterStage === '100') {
      filtered = filtered.filter(t => t.stage === 5);

    if (monFilterCat !== 'semua') {

  function parafPengesahanPimpinan(taskId) {
    const t = TASKS.find(x => x.id === taskId);
    if (!t) return;
    t.stage = 5;
    t.progress = "100%";
    t.lastUpdated = "Hari ini (" + new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + " WIB)";
    if (!t.history) t.history = [];
    t.history.push({
      time: "Hari ini, " + new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + " WIB",
      actor: currentUser.nama + ` (${currentUser.jabatan})`,
      note: "Validasi penuh & paraf pengesahan pimpinan 100% tuntas.",
      stage: 5
    });

    syncSingleTaskToCloud(t);
    renderUserTaskList();
    renderAlurView(activeTaskId);
    renderMonitoringView();
    bukaUnitDetailModal(taskId);
    showToast(`Pengesahan sukses! Tugas ${t.code} dinyatakan 100% tuntas.`);
  }

  function kirimFeedbackDisposisi(taskId) {
    const t = TASKS.find(x => x.id === taskId);
    const input = document.getElementById('input-modal-fb');
    if (!t || !input || !input.value.trim()) {
      showToast("Tuliskan catatan disposisi terlebih dahulu.");
      return;
    }
    const fb = input.value.trim();
    t.leaderFeedback = fb;
    t.lastUpdated = "Baru saja";
    if (!t.history) t.history = [];
    t.history.push({
      time: "Hari ini, " + new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + " WIB",
      actor: currentUser.nama + ` (${currentUser.jabatan})`,
      note: `Catatan Atasan: "${fb}"`,
      stage: t.stage
    });
    syncSingleTaskToCloud(t);
    renderMonitoringView();
    bukaUnitDetailModal(taskId);
    showToast("Feedback pimpinan berhasil disimpan!");
  }

  // Switch Akun Cepat & Simpan Sesi Pengguna ke localStorage
  function switchAparatur(targetId) {
    const target = APARATUR.find(a => a.id === targetId);
    if (!target) return;
    currentUser = target;
    localStorage.setItem(LS_USER_KEY, String(currentUser.id));

    const userTasks = getUserTasks();
    activeTaskId = userTasks.length > 0 ? userTasks[0].id : null;

    updateHeaderUI();
    renderAparaturModal();
    renderUserTaskList();
    renderAlurView(activeTaskId);
    renderLeaderboard();
    renderMonitoringView();
    checkRoleAccess();
    updateQuickRoleButtons();

    showToast(`Mode Aktif: ${currentUser.nama} (${currentUser.jabatan})`);
  }

  function updateQuickRoleButtons() {
    const bSekdes = document.getElementById('btn-role-sekdes');
    const bNaning = document.getElementById('btn-role-naning');
    const bKasun = document.getElementById('btn-role-kasun');

    if (bKasun) bKasun.className = `px-1 py-1 rounded-lg text-[9px] border transition truncate text-center ${currentUser.id === 9 ? act : inact}`;

  function updateHeaderUI() {
    document.getElementById('hdr-role-badge').innerText = currentUser.badge;
    document.getElementById('hdr-jabatan').innerText = currentUser.jabatan;
    document.getElementById('hdr-nama').innerText = currentUser.nama;
    document.getElementById('hdr-avatar').innerText = currentUser.nama.charAt(0);

    const capAvatar = document.getElementById('cap-avatar');
    const capNama = document.getElementById('cap-nama');
    const skpScore = document.getElementById('skp-score');
    const skpDurasi = document.getElementById('skp-durasi');
    const skpRank = document.getElementById('skp-rank');

    if (capAvatar) capAvatar.innerText = currentUser.nama.charAt(0);
    if (capNama) capNama.innerText = currentUser.nama;
    if (skpScore) skpScore.innerText = currentUser.score + '%';
    if (skpDurasi) skpDurasi.innerText = currentUser.durasi;

    const sorted = [...APARATUR].sort((a, b) => b.score - a.score);

    if (skpRank) skpRank.innerHTML = `#${rank} <span class="text-[9px] font-normal text-emerald-200">/ 11</span>`;

  function checkRoleAccess() {
    const leaderView = document.getElementById('mon-leader-container');
    const lockedView = document.getElementById('mon-locked-container');
    if (currentUser.isLeader) {
      if (leaderView) leaderView.classList.remove('hidden');
      if (lockedView) lockedView.classList.add('hidden');
    } else {
      if (leaderView) leaderView.classList.add('hidden');
      if (lockedView) lockedView.classList.remove('hidden');
    }

  function tutupModalGantiAkun() { document.getElementById('modal-ganti-akun').classList.add('hidden'); }

  // Formulir Buat Tugas
  function bukaModalBuatTugas() {
    const modal = document.getElementById('modal-buat-tugas');
    const sourceSelect = document.getElementById('select-task-source');
    const banner = document.getElementById('banner-form-non-atasan');

    if (currentUser.hasSubordinates) {
      banner.classList.add('hidden');
      sourceSelect.innerHTML = `
        <option value="kades" selected>Instruksi Langsung Atasan</option>
        <option value="mandiri">Inisiatif Mandiri Bidang</option>
        <option value="notulen">Notulen Rapat Musyawarah Desa</option>
      `;
    } else {
      banner.classList.remove('hidden');
      sourceSelect.innerHTML = `
        <option value="mandiri" selected>Inisiatif Mandiri Bidang</option>
        <option value="notulen">Notulen Rapat Musyawarah Desa</option>
      `;
    }
    handleFormSourceChange();
    modal.classList.remove('hidden');
  }

  function tutupModalBuatTugas() { document.getElementById('modal-buat-tugas').classList.add('hidden'); }

  function handleFormSourceChange() {
    const source = document.getElementById('select-task-source').value;
    const assigneeSelect = document.getElementById('select-task-assignee');
    const lockedLabel = document.getElementById('label-assignee-locked');

    if (source === 'mandiri') {
      assigneeSelect.innerHTML = `<option value="${currentUser.nama}">${currentUser.nama} (Diri Sendiri - Pelaksana Mandiri)</option>`;
      assigneeSelect.disabled = true;
      lockedLabel.classList.remove('hidden');
    } else if (source === 'notulen') {
      assigneeSelect.disabled = false;
      lockedLabel.classList.add('hidden');
      assigneeSelect.innerHTML = APARATUR.map(a => `<option value="${a.nama}">${a.nama} (${a.jabatan})</option>`).join('');
    } else {
      assigneeSelect.disabled = false;
      lockedLabel.classList.add('hidden');
      let allowed = [];
      if (currentUser.id === 1) allowed = APARATUR.filter(a => a.id !== 1);
      else if (currentUser.id === 2) allowed = APARATUR.filter(a => a.id > 2);
      else if (currentUser.id === 3) allowed = APARATUR.filter(a => a.id > 3);
      else allowed = [currentUser];
      assigneeSelect.innerHTML = allowed.map(a => `<option value="${a.nama}">${a.nama} (${a.jabatan})</option>`).join('');
    }
  }

  function simpanTugasBaru() {
    const title = document.getElementById('input-task-title').value;
    if (!title || !title.trim()) {
      showToast("Judul tugas wajib diisi!");
      return;
    }

    const source = document.getElementById('select-task-source').value;
    const assignee = document.getElementById('select-task-assignee').value;
    const priority = document.getElementById('select-task-priority').value;
    const deadline = document.getElementById('input-task-deadline').value || 'Hari ini (17.00 WIB)';
    const desc = document.getElementById('input-task-desc').value || 'Petunjuk dinas resmi.';

    let creatorName = currentUser.nama + ` (${currentUser.jabatan})`;
    if (source === 'mandiri') creatorName = `Inisiatif Mandiri (${currentUser.nama})`;
    else if (source === 'notulen') creatorName = `Notulen Rapat Desa`;

    const newId = Date.now();
    const newCode = `TGS-2025-${Math.floor(100 + Math.random() * 900)}`;

    const newTask = {
      id: newId,
      code: newCode,
      title: title.trim(),
      creator: creatorName,
      assignee: assignee,
      category: source,
      priority: priority,
      deadline: deadline,
      stage: 1,
      progress: "20%",
      desc: desc,
      location: "Balai Desa Sumengko",
      lastUpdated: "Hari ini, " + new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + " WIB",
      hasProof: false,
      proofNote: "",
      proofImg: "",
      leaderFeedback: "",
      history: [
        {
          time: "Hari ini, " + new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + " WIB",
          actor: creatorName,
          note: "Tugas didelegasikan ke " + assignee,
          stage: 1
        }
      ]
    };

    TASKS.unshift(newTask);
    document.getElementById('input-task-title').value = '';
    document.getElementById('input-task-desc').value = '';
    syncSingleTaskToCloud(newTask);
    tutupModalBuatTugas();
    renderUserTaskList();
    renderMonitoringView();
    showToast(`Tugas baru berhasil disimpan & dikirim ke: ${assignee}!`);
  }

  // Toast Helper
  function showToast(msg) {
    const toast = document.getElementById('toast-notif');
    const toastMsg = document.getElementById('toast-msg');
    toastMsg.innerText = msg;
    toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-4');
    toast.classList.add('opacity-100', 'translate-y-0');
    setTimeout(() => {
      toast.classList.remove('opacity-100', 'translate-y-0');
      toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-4');
    }, 2800);
  }
  
  // ==============================================================
  // OTENTIKASI PIN LOGIC
  // ==============================================================
  let currentPinInput = ''; 
  let pendingAparaturTarget = null; 

  function pilihAparaturDenganPin(aparaturId) { 
    const target = APARATUR.find(a => a.id === parseInt(aparaturId, 10)); 
    if (!target) return; 
    pendingAparaturTarget = target; 
    tutupModalGantiAkun(); 
    bukaModalPin(target); 
  } 

  function bukaModalPin(targetAparatur) { 
    currentPinInput = ''; 
    pendingAparaturTarget = targetAparatur; 
    document.getElementById('pin-target-avatar').innerText = targetAparatur.nama.charAt(0); 
    document.getElementById('pin-target-jabatan').innerText = targetAparatur.jabatan; 
    document.getElementById('pin-target-nama').innerText = targetAparatur.nama; 
    document.getElementById('pin-hint-text').innerText = targetAparatur.pin; 
    document.getElementById('pin-error-msg').classList.add('hidden'); 
    updatePinDots(); 
    document.getElementById('modal-pin-auth').classList.remove('hidden'); 
  } 

  function tutupModalPin() { 
    currentPinInput = ''; 
    pendingAparaturTarget = null; 
    document.getElementById('modal-pin-auth').classList.add('hidden'); 
  } 

  function updatePinDots() { 
    for (let i = 0; i < 6; i++) { 
      const dot = document.getElementById('pdot-' + i); 
      if (!dot) continue; 
      if (i < currentPinInput.length) { 
        dot.className = 'w-3 h-3 rounded-full border-2 border-gov-700 bg-gov-700 transition duration-200'; 
      } else { 
        dot.className = 'w-3 h-3 rounded-full border-2 border-slate-300 bg-white transition duration-200'; 
      } 
    } 
  } 

  function tekanKeypad(num) { 
    if (currentPinInput.length >= 6) return; 
    currentPinInput += num; 
    updatePinDots(); 
    document.getElementById('pin-error-msg').classList.add('hidden'); 
    if (currentPinInput.length === 6) { 
      setTimeout(verifikasiPinInput, 150); 
    } 
  } 

  function hapusDigitPin() { 
    if (currentPinInput.length > 0) { 
      currentPinInput = currentPinInput.slice(0, -1); 
      updatePinDots(); 
      document.getElementById('pin-error-msg').classList.add('hidden'); 
    } 
  } 

  function resetPinInput() { 
    currentPinInput = ''; 
    updatePinDots(); 
    document.getElementById('pin-error-msg').classList.add('hidden'); 
  } 

  function verifikasiPinInput() { 
    if (!pendingAparaturTarget) return; 
    if (currentPinInput === pendingAparaturTarget.pin) { 
      const selected = pendingAparaturTarget; 
      tutupModalPin(); 
      switchAparatur(selected.id); 
      showToast('Otentikasi Berhasil! Selamat datang, ' + selected.nama); 
    } else { 
      document.getElementById('pin-error-msg').classList.remove('hidden'); 
      for (let i = 0; i < 6; i++) { 
        const dot = document.getElementById('pdot-' + i); 
        if (dot) dot.className = 'w-3 h-3 rounded-full border-2 border-red-500 bg-red-100 transition duration-200'; 
      } 
      setTimeout(() => { 
        currentPinInput = ''; 
        updatePinDots(); 
      }, 700); 
    } 
  } 

  function kunciAkunSekarang() { 
    bukaModalPin(currentUser); 
    showToast('Sesi dikunci. Masukkan PIN 6 digit untuk melanjutkan.'); 
  } 

  function renderAparaturModal() { 
    const box = document.getElementById('modal-aparatur-list'); 
    if (!box) return; 
    box.innerHTML = APARATUR.map(a => `
      <div onclick="pilihAparaturDenganPin(${a.id});" class="flex items-center justify-between p-2 rounded-xl border ${a.id === currentUser.id ? 'bg-emerald-50 border-emerald-500 ring-1 ring-emerald-500' : 'bg-white border-slate-200'} hover:bg-slate-50 cursor-pointer transition">
        <div class="flex items-center space-x-2">
          <div class="w-6 h-6 rounded-full bg-gov-700 text-white font-bold text-xs flex items-center justify-center">${a.nama.charAt(0)}</div>
          <div>
            <p class="font-bold text-xs text-slate-800">${a.nama}</p>
            <p class="text-[9px] text-slate-500">${a.jabatan} • <span class="text-gov-700 font-semibold">${a.role}</span></p>
          </div>
        </div>
        <div class="flex items-center space-x-1">
          ${a.id === currentUser.id ? '<span class="text-[8px] bg-emerald-600 text-white px-2 py-0.5 rounded-full font-bold">Aktif</span>' : '<span class="text-[8px] bg-slate-100 text-slate-600 border border-slate-200 px-2 py-0.5 rounded-full font-semibold flex items-center"><i class="fa-solid fa-lock text-[7px] mr-1 text-slate-400"></i>PIN</span>'}
        </div>
      </div>
    `).join(''); 
  } 

  // ==============================================================
  // LOGIKA FITUR HAPUS TUGAS OLEH ADMIN SEKDES
  // ==============================================================
  let pendingDeleteTaskId = null; 
  
  function bukaModalHapus(taskId) { 
    const t = TASKS.find(x => x.id === parseInt(taskId, 10)); 
    if (!t) return; 
    pendingDeleteTaskId = t.id; 
    document.getElementById('del-task-code').innerText = t.code; 
    document.getElementById('del-task-title').innerText = t.title; 
    document.getElementById('modal-konfirmasi-hapus').classList.remove('hidden'); 
  } 
  
  function tutupModalHapus() { 
    pendingDeleteTaskId = null; 
    document.getElementById('modal-konfirmasi-hapus').classList.add('hidden'); 
  } 
  
  function konfirmasiHapusSekdes() { 
    if (!pendingDeleteTaskId) return; 
    deleteTask(pendingDeleteTaskId); 
    tutupModalHapus(); 
  } 
  
  function deleteTask(taskId) { 
    const idNum = parseInt(taskId, 10); 
    const targetIdx = TASKS.findIndex(x => x.id === idNum); 
    if (targetIdx === -1) return; 
    
    TASKS.splice(targetIdx, 1); 
    deleteSingleTaskFromCloud(idNum);
    
    if (typeof inspectedTaskId !== 'undefined' && inspectedTaskId === idNum) { 
      tutupUnitDetailModal(); 
    } 
    
    const remainingUserTasks = getUserTasks(); 
    if (activeTaskId === idNum) { 
      activeTaskId = remainingUserTasks.length > 0 ? remainingUserTasks[0].id : null; 
    } 
    
    renderUserTaskList(); 
    renderAlurView(activeTaskId); 
    renderMonitoringView(); 
    if (typeof renderLeaderboard === 'function') renderLeaderboard(); 
    showToast('Tugas berhasil dihapus permanen oleh Admin Sekdes.'); 
  } 

  // ==============================================================
  // SERVICE WORKER & INSTALASI PWA (ANDROID & IOS)
  // ==============================================================
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then((reg) => console.log('DesaTask SW aktif:', reg.scope))
        .catch((err) => console.error('DesaTask SW gagal:', err));
    });
  }

  let deferredInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
  });

  function setupPWAInstallButton() {
    const installBtn = document.querySelector('button[onclick*="Aplikasi siap diinstal"]');
    if (installBtn) {
      installBtn.removeAttribute('onclick');
      installBtn.addEventListener('click', async () => {
        if (deferredInstallPrompt) {
          deferredInstallPrompt.prompt();
          const { outcome } = await deferredInstallPrompt.userChoice;
          if (outcome === 'accepted') {
            showToast('DesaTask sedang dipasang ke layar utama HP...');
          }
          deferredInstallPrompt = null;
        } else {
          const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
          if (isIOS) {
            showToast('Pengguna iPhone/iPad: Ketuk ikon Share (kotak panah atas) di Safari lalu pilih "Add to Home Screen".');
          } else {
            showToast('Ketuk menu titik tiga (⋮) di pojok kanan atas browser lalu pilih "Instal aplikasi".');
          }
        }
      });
    }
  }
</script>
